<style>rect{fill:#f5f5f5;stroke:#555;rx:6}text{fill:#222}.d{stroke:#555;stroke-dasharray:4;fill:none}@media(prefers-color-scheme:dark){rect{fill:#222;stroke:#aaa}text{fill:#eee}}</style>
<rect x="20" y="20" width="200" height="60"/><text x="40" y="45">cron (every minute)</text><text x="40" y="65">perch tick</text>
